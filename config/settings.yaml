# Thresholds, caps and schedules (spec sections 5, 7 and 8). Values are defaults, tuned in
# Phases 2 and 3. Per-category weights and daily caps live in categories.yaml.

fetch:
  min_seconds_between_requests_per_host: 5    # L3
  timeout_seconds: 10
  min_poll_minutes: 15                        # L3: feeds are never polled more often
  poll_grace_minutes: 5                       # a feed is due this early, so runs 30 min apart line up
  robots_cache_hours: 24
  tdm_cache_hours: 24                         # site-wide /.well-known/tdmrep.json
  disable_feed_after_errors: 10
  disabled_feed_probe_hours: 24               # a disabled feed is retried once a day; success re-enables it
  backoff_max_hours: 24                       # cap on exponential backoff after errors
  max_redirects: 5                            # every hop is checked against the registry and blocklist
  max_response_bytes: 5000000
  max_entry_age_hours: 72                     # older feed entries are ignored
  title_max_chars: 300
  feed_summary_max_chars: 2000
  article_text_max_chars: 2000                # stored per article, and what stage 5 may send per item (D28)
  max_articles_per_run: 120                   # article pages per run, fetched by stage 5 just before it reads the items (D28)
  drop_query_params: [utm_*, fbclid, gclid]   # removed when canonicalising URLs; * matches any suffix

cluster:
  max_embed_per_run: 3000
  candidate_window_hours: 48
  candidate_top_k: 10
  cosine_weight: 1.0                          # labels: entity overlap hurt across languages (2026-10-24)
  entity_weight: 0.0
  join_threshold: 0.65                        # tuned on 200 labelled pairs, 2026-10-24 (`digest cluster-eval`)
  same_source_threshold: 0.90                 # joining a cluster that already has this source
  link_only_trigram_threshold: 0.35          # D25: tested on a day of BBC, Guardian, Al Jazeera titles
  link_only_max_hours_apart: 24               # unmatched link_only items are retried this long
  entity_set_max: 40                          # most frequent entities kept per cluster
  merge_cosine: 0.90
  merge_entity_jaccard: 0.0                   # entities unreliable across languages; cosine decides
  maintenance_every_hours: 2
  close_after_idle_hours: 36
  # CLUSTER_METHOD=tfidf (no ML): tuned on the same 200 labels, 2026-10-24
  # (`digest cluster-eval --method tfidf`): precision 0.90, recall 0.26
  tfidf_dim: 1024                             # hashed buckets per vector
  tfidf_join_threshold: 0.125
  tfidf_same_source_threshold: 0.5
  tfidf_merge_cosine: 0.5
  # D14: merge clusters whose stage-5 event lines (English, our words) match, within the
  # candidate window. Conservative start; tuned on live extractions in Phase 3.
  event_merge_cosine: 0.85
  tfidf_event_merge_cosine: 0.6
  # Before ranking, an open cluster this close to a story updated within the G5 window
  # joins that story instead of waiting for one of its own; two such stories merge.
  # 0.87 on live clusters, 28 Oct: the pairs at 0.87+ were one event, 0.80-0.86 had misses.
  story_merge_cosine: 0.87
  tfidf_story_merge_cosine: 0.5               # not tuned; the same as tfidf_merge_cosine
  # Stage 5 acts on the model's same_event_as only this alike: on 28 Oct it named an
  # arsenic story for a methane cluster (0.16); true matches were 0.51 and 0.53, and 90%
  # of unrelated same-category stories are below 0.39.
  same_event_min_cosine: 0.40
  tfidf_same_event_min_cosine: 0.05           # not tuned

rank:
  source_count_weight: 1.0                    # × ln(1 + independent sources)
  official_bonus: 0.5
  recency_weight: 0.4
  recency_half_life_hours: 8
  single_source_penalty: 0.6                  # one source and not official
  min_independent_sources: 1                  # owner, 2026-10-27: single-source stories too
  top_stories: 5
  top_stories_max_per_category: 2
  today_min_stories: 10
  today_max_stories: 12
  today_max_per_category: 3
  today_window_hours: 24
  unwritten_slot_hours: 4                     # a selection without a story frees its slot

synthesis:
  update_min_minutes: 480                     # min age of the last revision before an update
  max_retries: 1                              # D28: each retry is a full synthesis call
  max_input_tokens: 3000                      # D28: newest facts only, to stretch Groq's 200K tokens a day
  max_reports_read: 12                        # per new story, and per update run: 4 extract calls
  why_it_matters_max_words: 25
  headline_max_chars: 70
  owner_blurb_max_words: 60

gates:
  # Owner, 2026-10-27: no gate stops a story; G1 and G2 results are only recorded and the
  # G3 grader isn't called. Add g1, g2 or g3 back to enforce them again.
  enforce: []
  originality_shared_run_words: 8             # G2: fail on any shared run this long
  originality_headline_jaccard: 0.5           # G2
  originality_cross_lang_cosine: 0.90         # G2, embeddings mode only
  duplicate_cosine: 0.90                      # G5
  duplicate_window_hours: 24

retention:
  runs_days: 90
  llm_calls_days: 90

state:
  keep_state_files: 3
  keep_daily_snapshots: 14
  keep_weekly_snapshots: 8
  warn_size_mb: 100

publish:
  rebuild_if_older_than_hours: 3              # keeps time-based pages (Today) current
  glance_most_covered: 5                      # rows in "Most covered today"
  glance_developing_max: 3                    # rows in "Developing" (llm mode only)
  developing_max_age_hours: 6                 # a cluster's first item must be younger
  section_rows: 3                             # rows under the newest story in a section card
  category_page_hours: 48                     # window of /c/<category>
  briefing_seconds_per_story: 16              # behind "about N minutes"
  share_image_days: 7                         # D29: own share image for stories this new; older keep the site card
  keep_days: 60                               # D30: stories stay on the site this many days; the state file keeps all
  max_stories: 8000                           # D30: at most this many, newest first: 2 files each, under Cloudflare's 20,000

schedule:                                     # local time, Europe/Stockholm
  snapshot_after: "03:00"
  daily_report_after: "22:00"
  morning_refresh_by: "06:45"
  morning_alert_at: "06:50"
  robots_recheck_weekday: 0                   # Monday
  restore_test_day_of_month: 1

templates:                                    # thresholds for template stories (section 4)
  smhi_min_warning_level: yellow              # yellow | orange | red
  smhi_exclude_events: [WIND_SEA, LOW_SEA_LEVEL]   # SMHI event codes left out: marine warnings
  riksbank_policy_rate_change: true
  scb_new_release: true
