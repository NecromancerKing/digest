# Source registry (rule L1, spec section 4). Only sources listed here are ever fetched.
#
# Feed URLs were taken from each source's own site on 2026-10-23 (its feed list or the
# <link rel="alternate"> tag on its pages), never guessed. Every source ships disabled. The
# owner reads the terms, then sets usage_policy, display_headlines, fetch_article_pages,
# terms_checked_on (YYYY-MM-DD) and enabled. docs/SOURCES_REVIEW.md shows robots.txt, TDM
# and feed health for each one.
#
# usage_policy: open_license | facts_only | link_only. The values below are suggestions
# from the spec's candidate list; the terms review decides.
# extra_hosts: other hosts this source's links point to; only needed for article pages.
# Data sources for template stories (SMHI, Polisen events, Riksbank and SCB APIs) are
# added in Phase 3.

# --- Sweden

