# Source registry (rule L1, spec section 4). Only sources listed here are ever fetched.
#
# Feed URLs were taken from each source's own site (its feed list or the
# <link rel="alternate"> tag on its pages), never guessed. docs/SOURCES_REVIEW.md shows
# robots.txt, TDM and feed health for each one.
#
# Terms review, 2026-10-24: done by Claude Code at the owner's request. Each entry's
# "terms:" note says what the terms allow; rejected sources stay listed, disabled, so the
# reason is on record. Owner decision D13 (2026-10-24) enables some of them under an
# accepted gray area. The IP lawyer reviews all of this before launch (spec section 3).
#
# usage_policy: open_license | facts_only | link_only
# extra_hosts: other hosts this source's links point to; only needed for article pages.
# feeds[].category: files that feed's items under a category until stage 5 decides;
#   otherwise the source's first category_hint is used.
# publisher: sources sharing one count as a single independent source (stage 4).
# Data sources (template: <name>, a data_api feed) produce template stories in our own
# wording from their data (spec section 4). SMHI warnings first; Polisen events, Riksbank
# and SCB APIs after their terms review.

# =========================================================================== enabled

# --- Global

- id: global-voices
  name: Global Voices
  homepage: https://globalvoices.org/
  feeds:
