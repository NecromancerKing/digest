# --- Data sources (template stories)

- id: smhi-warnings
  name: SMHI
  homepage: https://www.smhi.se/vader/prognoser-och-varningar/varningar-och-meddelanden
  feeds:
    # Documented at https://opendata.smhi.se/apidocs/IBWwarnings (entry point version/1.json)
    - {url: "https://opendata-download-warnings.smhi.se/ibww/api/version/1/warning.json", kind: data_api}
  lang: sv
  country: SE
  category_hints: [climate]
  # terms: warnings are public and free to use, commercially too, but "Informationen får
  # inte ändras och källan till informationen skall alltid anges" (may not be changed;
  # always name the source). Other SMHI open data is CC BY 4.0. Templates repeat level,
  # event, areas and times unchanged and credit SMHI. SMHI asks clients not to re-fetch
  # the same data needlessly: polled every 30 minutes with conditional GET.
  usage_policy: open_license
  template: smhi_warning
  poll_minutes: 30
  terms_url: https://www.smhi.se/data/om-smhis-data/villkor-for-anvandning
  terms_checked_on: 2026-10-24
  official: true
  enabled: true

