# Source registry (rule L1, spec section 4). Only sources listed here are ever fetched.
#
# Feed URLs were taken from each source's own site (its feed list or the
# <link rel="alternate"> tag on its pages), never guessed. docs/SOURCES_REVIEW.md shows
# robots.txt, TDM and feed health for each one.
#
# Terms review, 2026-10-24: done by Claude Code at the owner's request. Each entry's
# "terms:" note says what the terms allow; rejected sources stay listed, disabled, so the
# reason is on record. The IP lawyer reviews these before launch (spec section 3).
#
# usage_policy: open_license | facts_only | link_only
# extra_hosts: other hosts this source's links point to; only needed for article pages.
# Data sources for template stories (SMHI, Polisen events, Riksbank and SCB APIs) are
# added in Phase 3.

# =========================================================================== enabled

# --- Global

- id: global-voices
  name: Global Voices
  homepage: https://globalvoices.org/
  feeds:
    - {url: "https://globalvoices.org/feed/", kind: rss}
  lang: en
  country: NL
  category_hints: [world]
  # terms: site licensed CC BY 3.0 (footer of every page); credit and link.
  usage_policy: open_license
  terms_url: https://creativecommons.org/licenses/by/3.0/
  terms_checked_on: 2026-10-24
  enabled: true

- id: the-conversation
  name: The Conversation
  homepage: https://theconversation.com/global
  feeds:
    - {url: "https://theconversation.com/global/home-page.atom", kind: atom}
    - {url: "https://theconversation.com/africa/articles.atom", kind: atom}
  lang: en
  country: AU
  category_hints: [world, tech_science, climate, economy]
  # terms: CC BY-ND; republishing allowed with author and The Conversation credited and
  # linked. No derivatives, so we use facts only and never its wording.
  usage_policy: facts_only
  terms_url: https://theconversation.com/global/republishing-guidelines
  terms_checked_on: 2026-10-24
  enabled: true

