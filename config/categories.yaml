# Categories (FR-1). Change freely; ids are used in URLs (/c/<slug>) and story files.
# weight: added to a cluster's rank score (stage 4).
# daily_cap: maximum stories selected per Europe/Stockholm calendar day, released in the
# paid budget's 4-hour steps (a sixth from midnight, rounded up) so later news gets slots.
# kind and hint: what stage 5 is told when it files a story. A topic category wins over a
# place category (world), which takes everything that fits no topic. A removed category's
# stories move to the first place category (D25).
# color, icon, short_names: the website's section colour, icon and pill name (spec section 10).
# former_slugs: old /c/<slug>/ addresses that now redirect here (D38).
- id: world
  slug: world
  names: {en: World, sv: Världen}
  weight: 0.3
  daily_cap: 21                 # D25: no Sweden category; world news is the core
  kind: place
  hint: news from any country that fits no topic below (politics, conflict, crime, disasters, extreme weather, society)
  color: teal
  icon: globe
  former_slugs: [climate]       # D38: Climate & Environment folded into World and Tech & Science

- id: economy
  slug: economy
  names: {en: Economy, sv: Ekonomi}
  weight: 0.2
  daily_cap: 7
  hint: central banks and interest rates, prices and inflation, markets and currencies, companies, jobs, housing
  color: amber
  icon: trend

- id: tech_science
  slug: tech
  names: {en: Tech & Science, sv: Teknik & vetenskap}
  weight: 0.1
  daily_cap: 6
  hint: technology, IT outages and data breaches, AI, space, research and discoveries, climate science and emissions, energy, nature and wildlife
  color: violet
  icon: flask

- id: health
  slug: health
  names: {en: Health, sv: Hälsa}
  weight: 0.1
  daily_cap: 6
  hint: medicine and treatments, diseases and outbreaks, public health, health care, mental health, food safety, diet and fitness
  color: green
  icon: heart

- id: entertainment
  slug: entertainment
  names: {en: Entertainment, sv: Nöje}
  weight: 0.05
  daily_cap: 6
  hint: film, TV and streaming, music, celebrities, video games, books, theatre and the arts
  keywords: [oscar, grammy, emmy, golden globe, bafta, box office, eurovision, netflix, hollywood,
    bollywood, k-pop, film festival, sitcom, pop star, rapper, singer, actor, actress, album]
  color: blue
  icon: clapper

- id: sport
  slug: sport
  names: {en: Sport, sv: Sport}
  weight: 0.0
  daily_cap: 6
  hint: sport of every kind
  keywords: [football, soccer, premier league, champions league, la liga, serie a, bundesliga,
    world cup, euro 202, grand prix, formula 1, formula one, f1 , nba, nfl, nhl, mlb, tennis,
    wimbledon, us open, french open, australian open, golf, cricket, rugby, ufc, boxing, olympic,
    paralympic, marathon, tour de france, cyclist, skiing, ice hockey, striker, goalkeeper,
    hat-trick, quarter-final, semi-final, fotboll, allsvenskan, fotball, håndbold]
  color: rose
  icon: trophy
