# Categories (FR-1). Change freely; ids are used in URLs (/c/<slug>) and story files.
# weight: added to a cluster's rank score (stage 4).
# daily_cap: maximum stories selected per Europe/Stockholm calendar day.
# kind and hint: what stage 5 is told when it files a story. A topic category wins over a
# place category (sweden, world), which take everything that fits no topic.
- id: sweden
  slug: sweden
  names: {en: Sweden, sv: Sverige}
  weight: 0.15                  # D12: global coverage, Sweden included
  daily_cap: 5
  kind: place
  hint: news from Sweden that fits no topic below (politics, crime, accidents, society)

- id: world
  slug: world
  names: {en: World, sv: Världen}
  weight: 0.3
  daily_cap: 12
  kind: place
  hint: international news that fits no topic below (politics, conflict, disasters, society)

- id: economy
  slug: economy
  names: {en: Economy, sv: Ekonomi}
  weight: 0.2
  daily_cap: 5
  hint: central banks and interest rates, prices and inflation, markets and currencies, companies, jobs, housing

- id: tech_science
  slug: tech
  names: {en: Tech & Science, sv: Teknik & vetenskap}
  weight: 0.1
  daily_cap: 5
  hint: technology, IT outages and data breaches, AI, space, research and discoveries

- id: climate
  slug: climate
  names: {en: Climate & Environment, sv: Klimat & miljö}
  weight: 0.1
  daily_cap: 4
  hint: weather warnings and extremes, climate, emissions, energy transition, nature and wildlife

- id: sport
  slug: sport
  names: {en: Sport, sv: Sport}
  weight: 0.0
  daily_cap: 4
  hint: sport of every kind
