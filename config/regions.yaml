# World regions for the "Your region" box and the region pages (D27). Change freely.
#
# places: names that put a story in the region: countries, their people, capitals, big
#   cities, a few leaders, and Swedish, Norwegian and Danish spellings for the Nordic
#   sources. Matched as whole words, case-sensitive, longest first ("Papua New Guinea"
#   before "Guinea", "New Mexico" before "Mexico"). A name may be in only one region.
#   Ambiguous names (Georgia, Jersey, Victoria, Amazon) are left out on purpose.
# timezones: IANA zones that pick the region in the reader's browser; an entry ending in
#   "/" is a prefix. The longest match wins, so "Africa/Cairo" beats "Africa/".

