# Topic pages (/topic/<name>/, D32): one per name that stage 5 found in three or more
# stories on the site (publish.topic_min_stories). Change freely.
#
# skip: names that never get a page: news agencies and outlets that reports cite. The news
#   sources' own names are skipped anyway, with their short forms ("BBC News" and "BBC");
#   official sources (police, central banks, weather services) are kept, since stories are
#   about them.
# aliases: other spellings of one name, as "other: main". Spellings that differ only in
#   accents, case, dashes, dots or apostrophes are one name already ("U.S." and
#   "US", "Mbappe" and "Mbappé"), so list only real variants.

