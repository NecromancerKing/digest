name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # No secrets here: CI runs on pull requests from anyone.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0 # publishes no major tag; pin the exact release
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe lint
      - run: uv run poe typecheck
      - run: uv run poe test
