name: pipeline

# One pipeline run about every 30 minutes (spec section 13). The run checks local time
# itself, so daylight saving time needs no cron changes. Each run also publishes.
# cron-job.org starts the runs through workflow_dispatch (D15); GitHub's own schedule is
# the backup and skips itself when a dispatched run started recently (D16).

on:
  schedule:
    - cron: "7,37 3-21 * * *" # UTC, every 30 min: about 05:00-23:40 Stockholm summer time
    - cron: "7 0-2,22,23 * * *" # UTC, hourly overnight
  workflow_dispatch: {}

permissions:
  contents: write # only for the daily keep-alive commit of status/last_run.json
  actions: read # the backup schedule looks for a recent dispatched run

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-35 minutes' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list -R "$GITHUB_REPOSITORY" -w pipeline -e workflow_dispatch \
            --json createdAt -q "[.[] | select(.createdAt > \"$since\")] | length")
          echo "dispatched runs since $since: $recent"
          if [ "$recent" -gt 0 ]; then echo run=false; else echo run=true; fi >> "$GITHUB_OUTPUT"

  run:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This repository is public: the log, the job summary and the commit below hold counts,
    # ids and timings only. Never add artifacts or caches of the state file or fetched text.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # publishes no major tag; pin the exact release
        with:
          enable-cache: true # Python packages only
      - run: uv sync --locked --no-dev
      - name: Cache the embedding model
        uses: actions/cache@v6 # public model files only: never the state or fetched text
        with:
          path: ~/.cache/fastembed
          key: embed-model-paraphrase-multilingual-MiniLM-L12-v2
      - name: Run pipeline
        run: uv run --no-sync digest run --once
        env:
          STATE_STORE: github_release
          STATE_UPLOAD: "true"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          CONTENT_REPO: ${{ vars.CONTENT_REPO }}
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME || 'Digest' }}
          SITE_NOINDEX: ${{ vars.SITE_NOINDEX || 'true' }} # until launch (Phase 6)
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # Pages edit only
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          # Until the site exists, the bot's contact URL is this repository.
          BOT_CONTACT_URL: ${{ vars.BOT_CONTACT_URL || format('{0}/{1}', github.server_url, github.repository) }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }} # alerts the owner (D19)
          # links until the Phase 3 eval has run; then set the repository variable to llm.
          SUMMARY_MODE: ${{ vars.SUMMARY_MODE || 'links' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Daily keep-alive commit
        # GitHub disables schedules after 60 days without activity. The run rewrites
        # status/last_run.json once per local day, and again when ok flips, so this
        # commits about once a day.
        if: always()
        run: |
          [ -f status/last_run.json ] || exit 0
          git add status/last_run.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(status): daily keep-alive [skip ci]"
          # A run that started on the same commit may have pushed first: the file is a
          # snapshot, so this run's (newer) copy wins. In a rebase, "theirs" is ours.
          git pull --rebase -X theirs
          git push
