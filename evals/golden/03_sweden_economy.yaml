      summary: The European Central Bank kept its deposit rate at 2 percent on Thursday and said it would decide meeting by meeting.
    - id: 2
      source: Danish Broadcaster
      lang: da
      title: ECB fastholder renten
      summary: ECB's prognose for inflationen i euroområdet næste år er 1,9 procent.
  facts:
