    - {text: "Two board members voted for a cut.", fact_ids: ["1:f1"], label: unsupported}

- id: e04-housing-prices
  category: economy
  docs:
    - id: 1
      source: Swedish Property Index
      lang: sv
      title: Bostadspriserna steg 1,4 procent i oktober
      summary: Priserna på bostadsrätter i Sverige steg med 1,4 procent i oktober jämfört med september, visar mäklarnas statistik. Störst var uppgången i Stockholm.
    - id: 2
      source: Nordic Public Radio
      lang: sv
      title: Bostadsmarknaden repar sig efter räntesänkningar
      summary: Priserna är nu 3 procent högre än för ett år sedan, enligt samma statistik.
  facts:
    - {id: "1:f1", statement: "Apartment prices in Sweden rose 1.4 percent in October from September.", attribution: "estate agents' statistics"}
    - {id: "1:f2", statement: "The biggest rise was in Stockholm.", attribution: "estate agents' statistics"}
    - {id: "2:f1", statement: "Prices are 3 percent higher than a year earlier.", attribution: "estate agents' statistics"}
  must_contain: ["1.4", "Stockholm"]
  must_not: ["fell", "14 percent"]
  claims:
    - {text: "Prices rose 1.4 percent in October.", fact_ids: ["1:f1"], label: supported}
    - {text: "Prices are up 3 percent on a year earlier.", fact_ids: ["2:f1"], label: supported}
    - {text: "Prices rose most in Gothenburg.", fact_ids: ["1:f2"], label: unsupported}
    - {text: "Rate cuts caused the rise, the agents say.", fact_ids: ["2:f1"], label: unsupported}

