    - {id: "1:f2", statement: "The ECB said it would decide meeting by meeting.", attribution: "ECB"}
    - {id: "2:f1", statement: "The ECB forecasts euro-area inflation of 1.9 percent next year.", attribution: "ECB"}
  must_contain: ["2 percent", "1.9"]
  must_not: ["lowered its deposit rate", "raised"]
  claims:
    - {text: "The deposit rate stays at 2 percent.", fact_ids: ["1:f1"], label: supported}
    - {text: "The ECB expects 1.9 percent inflation next year.", fact_ids: ["2:f1"], label: supported}
