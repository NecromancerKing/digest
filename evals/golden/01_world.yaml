      summary: Desert locust swarms have crossed into Marsabit county from Ethiopia, the UN Food and Agriculture Organization said, warning that pasture and crops are at risk.
    - id: 2
      source: Health Bulletin Wire
      lang: en
      title: Kenya begins aerial spraying against locusts
      summary: Kenya's agriculture ministry said spraying from four aircraft began on Friday across 15,000 hectares.
  facts:
    - {id: "1:f1", statement: "Desert locust swarms have crossed from Ethiopia into Marsabit county.", attribution: "FAO"}
    - {id: "1:f2", statement: "Pasture and crops are at risk.", attribution: "FAO"}
    - {id: "2:f1", statement: "Aerial spraying from four aircraft began on Friday.", attribution: "agriculture ministry"}
    - {id: "2:f2", statement: "Spraying covers 15,000 hectares.", attribution: "agriculture ministry"}
  must_contain: ["Marsabit", "15,000"]
  must_not: ["famine", "150,000"]
  claims:
    - {text: "Spraying began on Friday using four aircraft.", fact_ids: ["2:f1"], label: supported}
    - {text: "Swarms entered Kenya from Ethiopia, the FAO said.", fact_ids: ["1:f1"], label: supported}
    - {text: "The swarms have destroyed half of the county's harvest.", fact_ids: ["1:f2"], label: unsupported}
    - {text: "The FAO declared a famine in the region.", fact_ids: ["1:f2"], label: unsupported}
