      source: Northern Sweden Radio
      lang: sv
      title: Brand i skola i Umeå – elever evakuerade
      summary: Omkring 400 elever evakuerades när det började brinna i en skola i Umeå på tisdagsförmiddagen. Två elever fördes till sjukhus för kontroll efter att ha andats in rök, enligt räddningstjänsten.
    - id: 2
      source: Swedish Transport News
      lang: sv
      title: Skolbranden i Umeå släckt
      summary: Branden startade i ett förråd och är nu släckt. Polisen utreder vad som orsakade den.
  facts:
    - {id: "1:f1", statement: "About 400 pupils were evacuated when a fire broke out at a school in Umeå on Tuesday morning.", attribution: "rescue service"}
    - {id: "1:f2", statement: "Two pupils were taken to hospital for checks after inhaling smoke.", attribution: "rescue service"}
    - {id: "2:f1", statement: "The fire started in a storage room and has been put out.", attribution: "reporter"}
    - {id: "2:f2", statement: "Police are investigating the cause.", attribution: "police"}
  must_contain: ["Umeå", "400"]
  must_not: ["arson", "seriously injured"]
  claims:
    - {text: "About 400 pupils were evacuated.", fact_ids: ["1:f1"], label: supported}
    - {text: "Police are investigating what caused the fire.", fact_ids: ["2:f2"], label: supported}
    - {text: "Police suspect the fire was started deliberately.", fact_ids: ["2:f2"], label: unsupported}
    - {text: "Two teachers were taken to hospital.", fact_ids: ["1:f2"], label: unsupported}

- id: s06-budget-defence
