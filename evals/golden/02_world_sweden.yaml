- id: s08-hospital-waits
  category: sweden
  sensitivity: [health]
  docs:
    - id: 1
      source: Swedish Health Report
      lang: sv
      title: Väntetiderna till operation ökar i Region Skåne
      summary: Antalet patienter som väntat mer än 90 dagar på operation har ökat till 6 800 i Region Skåne, visar regionens egen statistik för september.
    - id: 2
      source: Southern Sweden Daily
      lang: sv
      title: Region Skåne lovar fler operationer på kvällstid
      summary: Regionen säger att den ska öppna operationssalar på kvällar och helger från november för att korta köerna.
  facts:
    - {id: "1:f1", statement: "6,800 patients in Region Skåne had waited more than 90 days for surgery in September.", attribution: "Region Skåne statistics"}
    - {id: "2:f1", statement: "The region will open operating theatres in the evenings and at weekends from November.", attribution: "Region Skåne"}
    - {id: "2:f2", statement: "The aim is to shorten waiting lists.", attribution: "Region Skåne"}
  must_contain: ["Skåne", "90 days"]
  must_not: ["68,000", "staff strike"]
  claims:
    - {text: "6,800 patients had waited more than 90 days for surgery.", fact_ids: ["1:f1"], label: supported}
    - {text: "Evening and weekend surgery starts in November.", fact_ids: ["2:f1"], label: supported}
    - {text: "Waiting times doubled since last year.", fact_ids: ["1:f1"], label: unsupported}
    - {text: "A shortage of nurses is behind the queues, the region says.", fact_ids: ["2:f2"], label: unsupported}
