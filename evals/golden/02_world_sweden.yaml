      lang: sv
      title: Regeringen vill öka försvarsanslaget med 12 miljarder
      summary: Regeringen föreslår i höstbudgeten att försvaret får 12 miljarder kronor mer nästa år, sa finansministern vid en pressträff på tisdagen.
    - id: 2
      source: Swedish Politics Weekly
      lang: sv
      title: Oppositionen kritiserar finansieringen av försvarsökningen
      summary: Oppositionen säger att ökningen finansieras med lån och kräver en plan för hur den ska betalas på sikt.
