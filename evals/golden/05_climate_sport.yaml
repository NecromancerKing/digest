      source: Europe Today
      lang: en
      title: Farmers count losses as Sicily rations water
      summary: Farm groups estimate crop losses at 700 million euros this year.
  facts:
    - {id: "1:f1", statement: "Sicily declared a water emergency on Tuesday after its driest summer on record.", attribution: "regional government"}
    - {id: "1:f2", statement: "Water is rationed in 93 towns.", attribution: "regional government"}
    - {id: "2:f1", statement: "Farm groups estimate crop losses at 700 million euros this year.", attribution: "farm groups"}
  must_contain: ["Sicily", "93"]
  must_not: ["7 billion", "wildfires"]
  claims:
    - {text: "Water is being rationed in 93 towns.", fact_ids: ["1:f2"], label: supported}
    - {text: "Farm groups put crop losses at 700 million euros.", fact_ids: ["2:f1"], label: supported}
    - {text: "The national government has sent emergency funds.", fact_ids: ["1:f1"], label: unsupported}
    - {text: "Crop losses are estimated at 7 billion euros.", fact_ids: ["2:f1"], label: unsupported}

- id: c06-coral
  category: climate
  docs:
    - id: 1
      source: Asia Pacific Line
      lang: en
      title: Survey finds bleaching on 60 percent of reefs surveyed off Queensland
      summary: An aerial survey found bleaching on 60 percent of the reefs it covered along the Great Barrier Reef, the marine park authority said on Monday.
    - id: 2
      source: Science Wire
      lang: en
      title: Marine heatwave behind latest reef bleaching
      summary: The authority said a marine heatwave in February and March was the main cause.
  facts:
    - {id: "1:f1", statement: "An aerial survey found bleaching on 60 percent of reefs surveyed along the Great Barrier Reef.", attribution: "marine park authority"}
    - {id: "2:f1", statement: "A marine heatwave in February and March was the main cause.", attribution: "marine park authority"}
  must_contain: ["60 percent", "Great Barrier Reef"]
  must_not: ["dead", "90 percent"]
  claims:
    - {text: "Bleaching was found on 60 percent of surveyed reefs.", fact_ids: ["1:f1"], label: supported}
    - {text: "A marine heatwave was the main cause, the authority says.", fact_ids: ["2:f1"], label: supported}
    - {text: "Half of the bleached coral has already died.", fact_ids: ["1:f1"], label: unsupported}
    - {text: "Agricultural runoff caused the bleaching.", fact_ids: ["2:f1"], label: unsupported}

- id: p01-football-allsvenskan
  category: sport
  docs:
