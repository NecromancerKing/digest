      source: Nordic Sport
      lang: sv
      title: Hammarby klart för Europaspel efter seger mot Häcken
      summary: Hammarby vann med 2–0 mot Häcken på söndagen och säkrade därmed en plats i kvalet till Conference League nästa säsong. Båda målen kom i andra halvlek.
    - id: 2
      source: Swedish Football Weekly
      lang: sv
      title: Hammarby trea inför sista omgången
      summary: Hammarby ligger trea i tabellen inför den sista omgången, två poäng bakom tvåan.
  facts:
    - {id: "1:f1", statement: "Hammarby beat Häcken 2-0 on Sunday.", attribution: "reporter"}
    - {id: "1:f2", statement: "The win secured a place in Conference League qualifying next season.", attribution: "reporter"}
    - {id: "1:f3", statement: "Both goals came in the second half.", attribution: "reporter"}
    - {id: "2:f1", statement: "Hammarby are third before the final round, two points behind second place.", attribution: "reporter"}
  must_contain: ["Hammarby", "2-0"]
  must_not: ["won the league", "Champions League"]
  claims:
    - {text: "Hammarby won 2-0 against Häcken.", fact_ids: ["1:f1"], label: supported}
    - {text: "Both goals were scored after half-time.", fact_ids: ["1:f3"], label: supported}
    - {text: "Hammarby qualified for the Champions League.", fact_ids: ["1:f2"], label: unsupported}
    - {text: "Hammarby top the table before the last round.", fact_ids: ["2:f1"], label: unsupported}

