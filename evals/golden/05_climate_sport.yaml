- id: p05-doping-ban
  category: sport
  sensitivity: [allegation_against_named_person]
  docs:
    - id: 1
      source: World Sport Wire
      lang: en
      title: Cycling team suspends rider pending doping hearing
      summary: Cycling team Velorama suspended one of its riders on Wednesday after a positive test for a banned substance in an out-of-competition sample, the team said. The rider denies wrongdoing.
    - id: 2
      source: Nordic Sport
      lang: sv
      title: Cyklist avstängd efter positivt prov
      summary: Ryttaren kan begära att B-provet analyseras, enligt det internationella cykelförbundet.
  facts:
    - {id: "1:f1", statement: "Team Velorama suspended a rider after a positive out-of-competition test for a banned substance.", attribution: "team"}
    - {id: "1:f2", statement: "The rider denies wrongdoing.", attribution: "rider"}
    - {id: "2:f1", statement: "The rider can ask for the B sample to be analysed.", attribution: "international cycling federation"}
  must_contain: ["Velorama", "B sample"]
  must_not: ["four-year ban", "admitted"]
  claims:
    - {text: "The rider denies any wrongdoing.", fact_ids: ["1:f2"], label: supported}
    - {text: "The rider may request a B-sample analysis.", fact_ids: ["2:f1"], label: supported}
    - {text: "The rider has been banned for four years.", fact_ids: ["1:f1"], label: unsupported}
