# Golden set, part 5 (see 01_world.yaml for the format). Invented events, people and clubs.

- id: c02-glacier-norway
  category: climate
  docs:
    - id: 1
      source: Norwegian Broadcaster
      lang: "no"
      title: Breen har krympet 40 meter på ett år
      summary: Nigardsbreen i Jostedalen har trukket seg tilbake 40 meter det siste året, viser målinger fra NVE. Det er den største tilbakegangen på ti år.
    - id: 2
      source: Science Wire
      lang: en
      title: Norwegian glacier retreats fastest in a decade
      summary: Scientists linked the retreat to a warm summer and little winter snow.
  facts:
    - {id: "1:f1", statement: "Nigardsbreen glacier retreated 40 metres over the past year.", attribution: "NVE measurements"}
    - {id: "1:f2", statement: "It is the largest retreat in ten years.", attribution: "NVE"}
    - {id: "2:f1", statement: "Scientists linked the retreat to a warm summer and little winter snow.", attribution: "scientists"}
  must_contain: ["40 metres", "Nigardsbreen"]
  must_not: ["400 metres", "disappear by"]
  claims:
    - {text: "The glacier retreated 40 metres in a year.", fact_ids: ["1:f1"], label: supported}
    - {text: "Scientists blame a warm summer and little snow.", fact_ids: ["2:f1"], label: supported}
    - {text: "The glacier will be gone by 2050.", fact_ids: ["1:f2"], label: unsupported}
    - {text: "It is the fastest retreat ever recorded in Norway.", fact_ids: ["1:f2"], label: unsupported}

- id: c03-emissions-eu
  category: climate
  docs:
    - id: 1
      source: Europe Today
      lang: en
      title: EU emissions fell 5 percent last year, agency says
      summary: Greenhouse gas emissions in the EU fell by 5 percent last year, mainly because less coal was burned for power, the European Environment Agency said.
    - id: 2
      source: Danish Broadcaster
      lang: da
      title: EU's udledning falder
      summary: Ifølge agenturet er udledningen nu 37 procent lavere end i 1990.
  facts:
    - {id: "1:f1", statement: "EU greenhouse gas emissions fell 5 percent last year.", attribution: "European Environment Agency"}
    - {id: "1:f2", statement: "The fall was mainly due to less coal burned for power.", attribution: "European Environment Agency"}
    - {id: "2:f1", statement: "Emissions are 37 percent lower than in 1990.", attribution: "European Environment Agency"}
  must_contain: ["5 percent", "1990"]
  must_not: ["55 percent", "rose"]
  claims:
    - {text: "Emissions are 37 percent below 1990 levels.", fact_ids: ["2:f1"], label: supported}
    - {text: "Less coal power drove most of the fall.", fact_ids: ["1:f2"], label: supported}
    - {text: "The EU is on track for its 2030 target.", fact_ids: ["2:f1"], label: unsupported}
    - {text: "Transport emissions fell the most.", fact_ids: ["1:f2"], label: unsupported}

- id: c04-wind-farm
  category: climate
  docs:
    - id: 1
      source: Swedish Industry News
      lang: sv
      title: Regeringen säger nej till havsbaserad vindkraft utanför Skåne
      summary: Regeringen avslår ansökan om en havsbaserad vindkraftspark med 60 turbiner söder om Skåne med hänvisning till försvarsintressen.
    - id: 2
      source: Southern Sweden Daily
      lang: sv
      title: Bolaget bakom vindparken besviket
      summary: Bolaget säger att det ska utvärdera beslutet. Parken skulle ha gett el till 400 000 hushåll.
  facts:
    - {id: "1:f1", statement: "The government rejected an application for a 60-turbine offshore wind farm south of Skåne.", attribution: "government"}
    - {id: "1:f2", statement: "The decision cited defence interests.", attribution: "government"}
    - {id: "2:f1", statement: "The company will evaluate the decision.", attribution: "company"}
    - {id: "2:f2", statement: "The farm would have supplied electricity to 400,000 households.", attribution: "company"}
  must_contain: ["60", "defence"]
  must_not: ["approved", "4 million households"]
  claims:
    - {text: "Defence interests were cited in the rejection.", fact_ids: ["1:f2"], label: supported}
    - {text: "The farm would have powered 400,000 homes, the company says.", fact_ids: ["2:f2"], label: supported}
    - {text: "The company will appeal to the Supreme Court.", fact_ids: ["2:f1"], label: unsupported}
    - {text: "The farm would have had 100 turbines.", fact_ids: ["1:f1"], label: unsupported}

- id: c05-drought-italy
  category: climate
  docs:
