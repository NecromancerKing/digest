# Golden set, part 4 (see 01_world.yaml for the format). Invented events, people and companies.

- id: t01-data-breach
  category: tech_science
  docs:
    - id: 1
      source: Tech Ledger
      lang: en
      title: Ticketing firm Seatwise says 1.2 million customer records exposed
      summary: Online ticket seller Seatwise said names, email addresses and partial card numbers of about 1.2 million customers were exposed in a breach discovered last week.
    - id: 2
      source: Nordic Public Radio
      lang: sv
      title: Dataintrång hos biljettsajt – svenskar drabbade
      summary: Integritetsskyddsmyndigheten har fått en anmälan från bolaget. Omkring 90 000 av de drabbade är svenska kunder.
  facts:
    - {id: "1:f1", statement: "Data on about 1.2 million Seatwise customers was exposed in a breach found last week.", attribution: "Seatwise"}
    - {id: "1:f2", statement: "Names, email addresses and partial card numbers were exposed.", attribution: "Seatwise"}
    - {id: "2:f1", statement: "The company has reported the breach to the Swedish data protection authority.", attribution: "reporter"}
    - {id: "2:f2", statement: "About 90,000 of those affected are Swedish customers.", attribution: "reporter"}
  must_contain: ["1.2 million", "90,000"]
  must_not: ["passwords", "12 million"]
  claims:
    - {text: "About 1.2 million customers' data was exposed.", fact_ids: ["1:f1"], label: supported}
    - {text: "Around 90,000 Swedish customers are affected.", fact_ids: ["2:f2"], label: supported}
    - {text: "Customers' passwords were stolen.", fact_ids: ["1:f2"], label: unsupported}
    - {text: "A ransomware gang has claimed the attack.", fact_ids: ["1:f1"], label: unsupported}

- id: t02-chip-plant
  category: tech_science
  docs:
    - id: 1
      source: Europe Today
      lang: en
      title: Chipmaker picks Dresden for 4 billion euro plant
      summary: Semiconductor company Lumetric will build a 4 billion euro factory in Dresden, creating about 1,500 jobs, the company said on Tuesday. Production is due to start in 2028.
    - id: 2
      source: Tech Ledger
      lang: en
      title: German subsidy covers a third of Lumetric plant
      summary: The German government will contribute about 1.3 billion euros in subsidies, subject to EU approval.
  facts:
    - {id: "1:f1", statement: "Lumetric will build a 4 billion euro chip factory in Dresden.", attribution: "Lumetric"}
    - {id: "1:f2", statement: "The plant will create about 1,500 jobs and start production in 2028.", attribution: "Lumetric"}
    - {id: "2:f1", statement: "Germany will contribute about 1.3 billion euros in subsidies, pending EU approval.", attribution: "reporter"}
  must_contain: ["Dresden", "2028"]
  must_not: ["15,000 jobs", "EU has approved"]
  claims:
    - {text: "The plant is expected to create about 1,500 jobs.", fact_ids: ["1:f2"], label: supported}
    - {text: "Subsidies still need EU approval.", fact_ids: ["2:f1"], label: supported}
    - {text: "The EU has already approved the subsidy.", fact_ids: ["2:f1"], label: unsupported}
    - {text: "Production will start in 2026.", fact_ids: ["1:f2"], label: unsupported}

- id: t03-comet
  category: tech_science
  docs:
    - id: 1
      source: Science Wire
      lang: en
      title: Newly found comet will be visible to the naked eye in March
      summary: A comet discovered in August by an observatory in Chile could become visible without binoculars in early March, astronomers said. It will pass closest to the Sun on 2 March.
    - id: 2
      source: Nordic Public Radio
      lang: sv
      title: Komet kan synas med blotta ögat i vår
      summary: Kometen syns bäst från norra halvklotet efter solnedgången, enligt astronomer vid Uppsala universitet.
  facts:
    - {id: "1:f1", statement: "A comet discovered in August by an observatory in Chile could be visible to the naked eye in early March.", attribution: "astronomers"}
    - {id: "1:f2", statement: "It will pass closest to the Sun on 2 March.", attribution: "astronomers"}
    - {id: "2:f1", statement: "It will be best seen from the northern hemisphere after sunset.", attribution: "Uppsala University astronomers"}
  must_contain: ["March", "Chile"]
  must_not: ["collide", "Earth"]
  claims:
    - {text: "The comet reaches its closest point to the Sun on 2 March.", fact_ids: ["1:f2"], label: supported}
    - {text: "It was discovered in August.", fact_ids: ["1:f1"], label: supported}
    - {text: "It is the brightest comet in 30 years.", fact_ids: ["1:f1"], label: unsupported}
    - {text: "It will be best seen before sunrise.", fact_ids: ["2:f1"], label: unsupported}

- id: t04-ai-act-fines
  category: tech_science
  docs:
    - id: 1
      source: Europe Today
      lang: en
      title: EU regulator opens first AI Act case against chatbot maker
      summary: The European Commission opened proceedings against chatbot developer Parlo under the AI Act on Wednesday, saying it may have failed to label AI-generated content.
    - id: 2
      source: Tech Ledger
      lang: en
      title: Parlo says it will cooperate with EU probe
      summary: Parlo said in a statement it would cooperate fully. Fines can reach 3 percent of global turnover.
  facts:
    - {id: "1:f1", statement: "The European Commission opened AI Act proceedings against chatbot developer Parlo on Wednesday.", attribution: "European Commission"}
    - {id: "1:f2", statement: "Parlo may have failed to label AI-generated content.", attribution: "European Commission"}
    - {id: "2:f1", statement: "Parlo said it would cooperate fully.", attribution: "Parlo"}
    - {id: "2:f2", statement: "Fines can reach 3 percent of global turnover.", attribution: "reporter"}
  must_contain: ["AI Act", "Parlo"]
  must_not: ["was fined", "30 percent"]
  claims:
    - {text: "Parlo says it will cooperate with the investigation.", fact_ids: ["2:f1"], label: supported}
    - {text: "Fines can reach 3 percent of global turnover.", fact_ids: ["2:f2"], label: supported}
    - {text: "Parlo has been fined 50 million euros.", fact_ids: ["2:f2"], label: unsupported}
    - {text: "The case concerns the use of copyrighted books.", fact_ids: ["1:f2"], label: unsupported}

- id: t05-battery-recycling
  category: tech_science
  docs:
    - id: 1
      source: Swedish Industry News
      lang: sv
      title: Batteriåtervinning i Västerås startar produktion
      summary: Återvinningsanläggningen Voltcykel i Västerås startade på måndagen och ska kunna ta emot 25 000 ton uttjänta batterier per år.
    - id: 2
      source: Science Wire
      lang: en
      title: Swedish plant to recover lithium and nickel from old batteries
      summary: The company says it can recover up to 95 percent of the metals, which will be sold back to battery makers.
  facts:
    - {id: "1:f1", statement: "The Voltcykel recycling plant in Västerås started on Monday.", attribution: "reporter"}
    - {id: "1:f2", statement: "It can process 25,000 tonnes of used batteries a year.", attribution: "company"}
    - {id: "2:f1", statement: "Up to 95 percent of the metals can be recovered.", attribution: "company"}
    - {id: "2:f2", statement: "The metals will be sold back to battery makers.", attribution: "company"}
  must_contain: ["Västerås", "25,000"]
  must_not: ["250,000", "state-owned"]
  claims:
    - {text: "The plant can handle 25,000 tonnes a year.", fact_ids: ["1:f2"], label: supported}
    - {text: "Up to 95 percent of the metals can be recovered, the company says.", fact_ids: ["2:f1"], label: supported}
    - {text: "The plant will employ 800 people.", fact_ids: ["1:f1"], label: unsupported}
    - {text: "The plant received government funding.", fact_ids: ["1:f1"], label: unsupported}

- id: t06-fusion-record
  category: tech_science
  docs:
    - id: 1
      source: Science Wire
      lang: en
      title: Fusion test sustains plasma for record 22 minutes
      summary: Researchers at a fusion facility in Cadarache, France, kept a plasma stable for 22 minutes, a record for the device, the project said on Friday.
    - id: 2
      source: Danish Broadcaster
      lang: da
      title: Ny fusionsrekord i Frankrig
      summary: Forskerne understreger, at der stadig er mange år til et kraftværk.
  facts:
    - {id: "1:f1", statement: "A plasma was kept stable for 22 minutes at a fusion facility in Cadarache, France.", attribution: "project"}
    - {id: "1:f2", statement: "It is a record for the device.", attribution: "project"}
    - {id: "2:f1", statement: "The researchers stress that a power plant is still many years away.", attribution: "researchers"}
  must_contain: ["22 minutes", "Cadarache"]
  must_not: ["net energy", "power plant by 2030"]
  claims:
    - {text: "The plasma stayed stable for 22 minutes.", fact_ids: ["1:f1"], label: supported}
    - {text: "Researchers say a power plant is still many years away.", fact_ids: ["2:f1"], label: supported}
    - {text: "The test produced more energy than it used.", fact_ids: ["1:f2"], label: unsupported}
    - {text: "It is a world record for any fusion device.", fact_ids: ["1:f2"], label: unsupported}

- id: t07-outage-bank
  category: tech_science
  docs:
    - id: 1
      source: Nordic Public Radio
      lang: sv
      title: Storbank drabbad av it-störning – kort fungerade inte
      summary: Kunder i banken Nordkust kunde inte betala med kort eller logga in i appen under fyra timmar på fredagen. Banken säger att felet berodde på en uppdatering.
    - id: 2
      source: Tech Ledger
      lang: en
      title: Nordkust says outage was not a cyberattack
      summary: The bank said there was no sign of an attack and that customers who were charged twice will be refunded.
  facts:
    - {id: "1:f1", statement: "Nordkust customers could not pay by card or log in to the app for four hours on Friday.", attribution: "reporter"}
    - {id: "1:f2", statement: "The fault was caused by an update.", attribution: "bank"}
    - {id: "2:f1", statement: "There was no sign of a cyberattack.", attribution: "bank"}
    - {id: "2:f2", statement: "Customers charged twice will be refunded.", attribution: "bank"}
  must_contain: ["four hours", "update"]
  must_not: ["hackers", "two days"]
  claims:
    - {text: "Card payments were down for four hours.", fact_ids: ["1:f1"], label: supported}
    - {text: "Double charges will be refunded.", fact_ids: ["2:f2"], label: supported}
    - {text: "Hackers caused the outage.", fact_ids: ["2:f1"], label: unsupported}
    - {text: "The financial regulator has opened an inquiry.", fact_ids: ["1:f2"], label: unsupported}

